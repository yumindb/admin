name: Daily Backup to R2

on:
  schedule:
    # 02:00 Taipei time (UTC+8) = 18:00 UTC previous day
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup DB + Storage to R2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set timestamp
        id: ts
        run: |
          TS=$(TZ=Asia/Taipei date +%Y%m%d_%H%M%S)
          DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Prepend pg17 binaries so they win over the pre-installed pg16
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [supabase]
          type = s3
          provider = Other
          access_key_id = ${SUPABASE_S3_ACCESS_KEY}
          secret_access_key = ${SUPABASE_S3_SECRET_KEY}
          region = ${SUPABASE_S3_REGION}
          endpoint = ${SUPABASE_S3_ENDPOINT}
          force_path_style = true
          no_check_bucket = true
          chunk_size = 32M

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          no_check_bucket = true
          EOF

      - name: Dump Postgres (public schema)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          mkdir -p out
          # Sanity check: confirm DB connection works first, fail fast with a clear error
          psql "$SUPABASE_DB_URL" -c "select current_user, version();" || {
            echo "::error::Cannot connect to Supabase. Check SUPABASE_DB_URL secret."
            exit 1
          }
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner --no-acl \
            --quote-all-identifiers \
            | gzip > out/db_${{ steps.ts.outputs.ts }}.sql.gz
          ls -lh out/
          echo "Dump size: $(stat -c%s out/db_${{ steps.ts.outputs.ts }}.sql.gz) bytes"

      - name: Mirror Storage buckets
        run: |
          for bucket in daily-photos signatures daily-log-pdfs; do
            mkdir -p "out/storage/$bucket"
            echo "::group::Mirror $bucket"
            rclone copy "supabase:$bucket" "out/storage/$bucket" \
              --transfers=8 --checkers=16 --stats=30s
            echo "::endgroup::"
          done
          echo "Storage sizes:" && du -sh out/storage/*

      - name: Write manifest
        run: |
          cat > out/manifest.json <<EOF
          {
            "timestamp": "${{ steps.ts.outputs.ts }}",
            "date": "${{ steps.ts.outputs.date }}",
            "workflow_run": "${{ github.run_id }}",
            "trigger": "${{ github.event_name }}",
            "buckets": ["daily-photos", "signatures", "daily-log-pdfs"],
            "schema": "public"
          }
          EOF

      - name: Upload DB dump to R2
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET || 'yumin-admin-backup' }}
        run: |
          rclone copy out/db_${{ steps.ts.outputs.ts }}.sql.gz \
            r2:${R2_BUCKET}/db/ --stats=30s
          rclone copy out/manifest.json \
            r2:${R2_BUCKET}/db/manifest_${{ steps.ts.outputs.ts }}.json

      - name: Sync Storage to R2 (latest mirror)
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET || 'yumin-admin-backup' }}
        run: |
          rclone sync out/storage r2:${R2_BUCKET}/storage-latest \
            --transfers=8 --checkers=16 --fast-list --stats=30s

      - name: Prune DB dumps older than 90 days
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET || 'yumin-admin-backup' }}
        run: |
          rclone delete r2:${R2_BUCKET}/db/ \
            --min-age 90d --include 'db_*.sql.gz' --include 'manifest_*.json'

      - name: Summary
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET || 'yumin-admin-backup' }}
        run: |
          echo "## Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: ${{ steps.ts.outputs.ts }}" >> $GITHUB_STEP_SUMMARY
          echo "- **DB dump**: \`db/db_${{ steps.ts.outputs.ts }}.sql.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Storage mirror**: \`storage-latest/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### R2 bucket usage" >> $GITHUB_STEP_SUMMARY
          rclone size r2:${R2_BUCKET} >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure (email)
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL_USER }}
          password: ${{ secrets.NOTIFY_EMAIL_APP_PASSWORD }}
          subject: "🚨【裕民備份失敗】${{ steps.ts.outputs.date }} 請立即確認 🚨"
          from: "裕民備份監控 <${{ secrets.NOTIFY_EMAIL_USER }}>"
          to: yumindb@gmail.com, evelyn.evagor@gmail.com
          priority: high
          body: |
            ⚠️ 裕民工務 admin 系統 — 每日備份失敗

            日期：${{ steps.ts.outputs.date }}
            時間戳：${{ steps.ts.outputs.ts }}
            觸發方式：${{ github.event_name }}

            👉 點此查看詳細錯誤訊息：
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            意義：昨晚的「資料庫 + 工程照片 + 簽名 + PDF」沒有成功備份到 Cloudflare。
            行動：請立即點上方連結查看是哪一步失敗，修好之後手動重跑備份（Actions → Daily Backup to R2 → Run workflow）。

            ——
            此信由 GitHub Actions 自動發出，請勿回覆。
